<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b11"><title>Tài khoản — Shop Trần Vinh</title>
<style>
:root{--bg:#080b11;--card:#111823;--line:#2c384b;--text:#f5f7fb;--muted:#a8b2c2;--purple:#a855f7;--green:#8ef0ad}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#26133b,#080b11 48%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:520px;margin:auto;padding:18px 15px 40px}.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}.back{width:40px;height:40px;border:1px solid #39475d;border-radius:12px;display:grid;place-items:center;background:#0d141e}.brand{flex:1}.brand b{font-size:19px}.brand small{display:block;color:var(--muted);font-size:12px;margin-top:2px}.box{background:linear-gradient(145deg,#121a25,#0f151e);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:12px;box-shadow:0 10px 30px #0003}.title{font-size:27px;margin:3px 0 5px}.sub{color:var(--muted);margin:0 0 14px;line-height:1.4}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;background:#0b1017;border:1px solid #303b4d;padding:4px;border-radius:12px}.tab{appearance:none;border:0;background:transparent;color:#aeb7c6;padding:10px;border-radius:9px;font-weight:900;font-size:15px}.tab.active{background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff}label{display:block;font-size:13px;color:#c8d0dc;margin:13px 0 6px}input{width:100%;box-sizing:border-box;padding:13px;border-radius:11px;font-size:16px;background:#090e15;color:#fff;border:1px solid #39475d;outline:none}input:focus{border-color:#a855f7}button.submit{width:100%;padding:13px;border:0;border-radius:11px;font-size:16px;background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;font-weight:950;margin-top:15px;min-height:46px}.msg{min-height:22px;margin:11px 0 0;color:var(--muted);font-size:14px}.ok{color:var(--green)}.account{display:none;text-align:center}.user{font-size:20px;font-weight:900;margin:8px 0}.logout{background:#0b1017!important;border:1px solid #39475d!important}.hint{font-size:13px;color:var(--muted);line-height:1.45;margin-top:13px}.orders{margin-top:16px}.order-card{border:1px solid #303b4d;border-radius:13px;padding:13px;margin-top:9px;background:#0b1017}.order-top{display:flex;justify-content:space-between;gap:8px}.order-name{font-weight:900}.order-id{font-size:12px;color:#8f9aac;margin-top:3px;word-break:break-all}.order-meta{font-size:13px;color:#aeb7c6;margin-top:7px}.paid{color:#8ef0ad;font-weight:900}.pending{color:#f6c85f;font-weight:900}.download{display:inline-block;margin-top:9px;padding:9px 12px;border-radius:9px;background:#25c45a;color:#fff;font-weight:900}.empty{color:#a8b2c2;font-size:14px;padding:10px 0}
</style></head><body><div class="wrap">
<div class="top"><a class="back" href="/">‹</a><div class="brand"><b>Shop Trần Vinh</b><small>TÀI KHOẢN</small></div></div>
<div class="box" id="authBox"><h1 class="title">Tài khoản</h1><p class="sub">Đăng nhập hoặc tạo tài khoản trước khi mua sản phẩm.</p>
<div class="tabs"><button class="tab active" id="loginTab" type="button">Đăng nhập</button><button class="tab" id="regTab" type="button">Đăng ký</button></div>
<form id="loginForm"><label>Tên đăng nhập</label><input id="lu" autocomplete="username" required><label>Mật khẩu</label><input id="lp" type="password" autocomplete="current-password" required><button class="submit" id="loginBtn" type="submit">Đăng nhập</button><p id="ls" class="msg"></p></form>
<form id="regForm" style="display:none"><label>Tên đăng nhập</label><input id="ru" autocomplete="username" minlength="3" required><label>Mật khẩu</label><input id="rp" type="password" autocomplete="new-password" minlength="4" required><label>Nhập lại mật khẩu</label><input id="rc" type="password" autocomplete="new-password" minlength="4" required><button class="submit" type="submit">Tạo tài khoản</button><p id="rs" class="msg"></p></form>
</div>
<div class="box account" id="accountBox"><div class="user">👤 <span id="who"></span></div><p class="sub">Bạn đã đăng nhập. Có thể quay lại shop và bấm <b>Mua ngay</b>.</p><button class="submit logout" id="logout" type="button">Đăng xuất</button><div class="orders"><h2 style="font-size:21px;margin:18px 0 7px">Đơn hàng của tôi</h2><div id="ordersList"><div class="empty">Đang tải lịch sử đơn hàng...</div></div></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const next=new URLSearchParams(location.search).get('next')||'/';
function switchTab(reg){$('loginTab').classList.toggle('active',!reg);$('regTab').classList.toggle('active',reg);$('loginForm').style.display=reg?'none':'block';$('regForm').style.display=reg?'block':'none';}
$('loginTab').onclick=()=>switchTab(false);$('regTab').onclick=()=>switchTab(true);
async function requestJSON(url,options={}){
  options.credentials='same-origin';
  const controller=new AbortController(); const timer=setTimeout(()=>controller.abort(),10000);
  try{const r=await fetch(url,{...options,signal:controller.signal,credentials:'same-origin'}); let x={}; try{x=await r.json();}catch{} return {r,x};}
  finally{clearTimeout(timer);}
}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('loginBtn');btn.disabled=true;$('ls').textContent='Đang đăng nhập...';$('ls').className='msg';try{const {r,x}=await requestJSON('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('lu').value.trim(),password:$('lp').value})});if(r.ok){$('ls').textContent='Đăng nhập thành công.';$('ls').className='msg ok';setTimeout(()=>location.href=next,200)}else $('ls').textContent=x.error||'Đăng nhập thất bại.';}catch{$('ls').textContent='Không kết nối được máy chủ. Hãy tải lại trang và thử lại.';}finally{btn.disabled=false;}});
$('regForm').addEventListener('submit',async e=>{e.preventDefault();if($('rp').value!==$('rc').value){$('rs').textContent='Mật khẩu nhập lại không khớp.';return;}$('rs').textContent='Đang tạo tài khoản...';try{const {r,x}=await requestJSON('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('ru').value.trim(),password:$('rp').value})});if(r.ok){$('rs').textContent='Tạo tài khoản thành công.';$('rs').className='msg ok';setTimeout(()=>location.href=next,200)}else $('rs').textContent=x.error||'Đăng ký thất bại.';}catch{$('rs').textContent='Không kết nối được máy chủ. Hãy tải lại trang và thử lại.';}});
$('logout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST'});location.reload();};
function money(n){return new Intl.NumberFormat('vi-VN').format(n)+'đ';}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]));}
async function loadOrders(){
  const box=$('ordersList');
  try{
    const r=await fetch('/api/my-orders',{cache:'no-store',credentials:'same-origin'}); const list=await r.json();
    if(!r.ok) throw new Error(list.error||'Lỗi');
    if(!list.length){box.innerHTML='<div class="empty">Chưa có đơn hàng nào.</div>';return;}
    box.innerHTML=list.map(o=>{
      const state=o.paid?'<span class="paid">ĐÃ THANH TOÁN</span>':'<span class="pending">CHỜ THANH TOÁN</span>';
      const dl=o.download?'<a class="download" href="/api/orders/'+encodeURIComponent(o.orderId)+'/download">⇩ Tải file lại</a>':'';
      const key=o.key?'<div class="order-meta"><b>Key:</b> '+esc(o.key)+'</div>':'';
      return '<div class="order-card"><div class="order-top"><div class="order-name">'+esc(o.product)+'</div><div>'+state+'</div></div><div class="order-id">'+esc(o.orderId)+'</div><div class="order-meta">'+money(o.amount)+(o.edition?' • '+esc(o.edition):'')+'</div>'+key+dl+'</div>';
    }).join('');
  }catch(e){box.innerHTML='<div class="empty">Không tải được lịch sử đơn hàng. Hãy tải lại trang.</div>';}
}
(async()=>{const r=await fetch('/api/auth/me',{cache:'no-store'});const x=await r.json();if(x.authenticated){$('authBox').style.display='none';$('accountBox').style.display='block';$('who').textContent=x.user.username;loadOrders();}})();
</script></body></html>
