<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tài khoản — Shop Trần Vinh</title><style>body{margin:0;background:#080b11;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:520px;margin:0 auto;padding:28px 16px}.box{background:#111823;border:1px solid #2c384b;border-radius:18px;padding:18px;margin-top:15px}input,button{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;font-size:16px}input{background:#0b1017;color:#fff;border:1px solid #39475d;margin:7px 0}button{border:0;background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;font-weight:900;margin-top:8px}.muted{color:#a8b2c2}.ok{color:#8ef0ad}.link{display:inline-block;margin-top:15px;color:#d8a8ff}</style></head><body><div class="wrap"><h1>Shop Trần Vinh</h1><p class="muted">Đăng nhập bắt buộc trước khi mua.</p><div class="box"><h2>Đăng nhập</h2><input id="lu" placeholder="Tên đăng nhập"><input id="lp" type="password" placeholder="Mật khẩu"><button onclick="login()">Đăng nhập</button><p id="ls" class="muted"></p></div><div class="box"><h2>Tạo tài khoản</h2><input id="ru" placeholder="Tên đăng nhập"><input id="rp" type="password" placeholder="Mật khẩu"><button onclick="reg()">Đăng ký</button><p id="rs" class="muted"></p></div><a class="link" href="/">← Về shop</a></div><script>async function login(){const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:lu.value,password:lp.value})});const x=await r.json();if(r.ok){ls.textContent='Đăng nhập thành công.';ls.className='ok';setTimeout(()=>location.href=new URLSearchParams(location.search).get('next')||'/',400)}else ls.textContent=x.error||'Lỗi'}async function reg(){const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:ru.value,password:rp.value})});const x=await r.json();rs.textContent=r.ok?'Tạo tài khoản thành công.':(x.error||'Lỗi');if(r.ok)rs.className='ok'}</script></body></html>
