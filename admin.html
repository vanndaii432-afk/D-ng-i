<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b11"><title>Admin — Shop Trần Vinh</title>
<style>
:root{--bg:#080b11;--card:#111823;--line:#2c384b;--text:#fff;--muted:#a8b2c2;--gold:#f2c14e;--green:#8ef0ad;--red:#ff8f8f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#26133b,#080b11 48%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:900px;margin:auto;padding:18px 15px 50px}.top{display:flex;align-items:center;gap:10px}.back{width:40px;height:40px;border:1px solid #39475d;border-radius:12px;display:grid;place-items:center;background:#0d141e;font-size:24px}.brand{flex:1}.brand b{font-size:19px}.brand small{display:block;color:var(--muted);font-size:12px}.box{background:linear-gradient(145deg,#121a25,#0f151e);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}h1{font-size:27px;margin:18px 0 0}h2{margin:0 0 12px}input,button,select{width:100%;box-sizing:border-box;padding:12px;border-radius:11px;font-size:16px}input,select{background:#0b1017;color:#fff;border:1px solid #39475d}button{border:0;background:var(--gold);color:#111;font-weight:950;margin-top:9px;min-height:44px}.muted{color:var(--muted);line-height:1.4}.error{color:var(--red)}.order{border:1px solid #2d394c;border-radius:14px;padding:13px;margin-top:10px;background:#0d141d}.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:4px 0}.pending{color:#ffd166}.paid{color:var(--green)}.key{color:#86efac;font-weight:900;word-break:break-all}.logout{background:#0b1017;color:#fff;border:1px solid #39475d}.topbtn{width:auto;padding:9px 12px;background:#0b1017;color:#fff;border:1px solid #39475d;margin:0}
</style></head><body><div class="wrap">
<div class="top"><a class="back" href="/">‹</a><div class="brand"><b>Shop Trần Vinh</b><small>QUẢN TRỊ</small></div><button class="topbtn" id="logout" style="display:none">Đăng xuất</button></div>
<h1>👑 Admin</h1>
<div class="box" id="login"><h2>Đăng nhập Admin</h2><p class="muted">Mật khẩu được kiểm tra ở máy chủ và không hiển thị trên trang.</p><input id="pw" type="password" autocomplete="current-password" placeholder="Mật khẩu Admin"><button id="loginBtn">Đăng nhập</button><p id="ls" class="muted"></p></div>
<div id="dash" style="display:none">
<div class="box"><h2>Danh sách đơn</h2><button id="refresh">🔄 Làm mới</button><div id="orders"></div></div>
<div class="box"><h2>Admin Test</h2><p class="muted">Tạo đơn 0đ để kiểm tra luồng cấp Key/file.</p><select id="prod"><option value="panel_vip">PANEL VIP</option><option value="aim_body_ios">AIM BODY</option><option value="dvi_xanh_adr">DVI XANH - Keo Mờ</option></select><button id="test">Mua FREE (0đ)</button><p id="ts" class="muted"></p></div>
</div></div>
<script>
let pass=sessionStorage.getItem('tv_admin')||'';
const $=id=>document.getElementById(id);
const money=n=>new Intl.NumberFormat('vi-VN').format(n)+'đ';
async function adminFetch(url,opt={}){opt.headers={...(opt.headers||{}),'x-admin-password':pass};return fetch(url,opt);}
async function adminLogin(){pass=$('pw').value;const r=await adminFetch('/admin/api/orders');if(!r.ok){pass='';$('ls').textContent='Mật khẩu không đúng hoặc ADMIN_PASSWORD chưa được cấu hình trên Render.';$('ls').className='muted error';return;}sessionStorage.setItem('tv_admin',pass);show();}
function show(){$('login').style.display='none';$('dash').style.display='block';$('logout').style.display='block';load();}
async function load(){const r=await adminFetch('/admin/api/orders',{cache:'no-store'});if(!r.ok)return;const a=await r.json();$('orders').innerHTML=a.length?a.map(o=>`<div class="order"><div class="row"><b>${esc(o.orderId)}</b><span class="${o.status==='PAID'?'paid':'pending'}">${o.status==='PAID'?'ĐÃ THANH TOÁN':'CHỜ THANH TOÁN'}</span></div><div class="row"><span>${esc(o.product)}${o.edition?' • '+esc(o.edition):''}</span><b>${money(o.amount)}</b></div><div class="muted">Khách: ${esc(o.username)}</div>${o.key?`<div class="key">🔑 ${esc(o.key)}</div>`:''}${o.status!=='PAID'?`<button data-confirm="${esc(o.orderId)}">✓ Xác nhận đã nhận tiền</button>`:''}</div>`).join(''):'<p class="muted">Chưa có đơn.</p>';document.querySelectorAll('[data-confirm]').forEach(b=>b.onclick=()=>confirmOrder(b.dataset.confirm));}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
async function confirmOrder(id){if(!confirm('Bạn đã kiểm tra giao dịch và nhận đúng số tiền?'))return;const r=await adminFetch('/admin/api/orders/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderId:id})});if(!r.ok){alert('Không xác nhận được.');return;}load();}
async function test(){const r=await adminFetch('/admin/api/test-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({productId:$('prod').value})});const x=await r.json();$('ts').textContent=r.ok?`Đơn test ${x.orderId} — ${x.status}${x.key?' — Key: '+x.key:''}`:(x.error||'Lỗi');load();}
$('loginBtn').onclick=adminLogin;$('refresh').onclick=load;$('test').onclick=test;$('logout').onclick=()=>{sessionStorage.removeItem('tv_admin');pass='';location.reload();};
if(pass)show();
</script></body></html>
