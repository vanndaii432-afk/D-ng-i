<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Shop Trần Vinh</title><style>body{margin:0;background:#080b11;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:900px;margin:auto;padding:24px 16px 50px}.box{background:#111823;border:1px solid #2c384b;border-radius:18px;padding:18px;margin-top:15px}input,button,select{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;font-size:16px}input{background:#0b1017;color:#fff;border:1px solid #39475d}button{border:0;background:#f2c14e;color:#111;font-weight:900;margin-top:10px}.order{border:1px solid #2d394c;border-radius:14px;padding:14px;margin-top:12px;background:#0d141d}.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:5px 0}.pending{color:#ffd166}.paid{color:#8ef0ad}.muted{color:#a8b2c2}.key{color:#86efac;font-weight:900}</style></head><body><div class="wrap"><h1>👑 Admin — Shop Trần Vinh</h1><div class="box" id="login"><h2>Đăng nhập Admin</h2><input id="pw" type="password" placeholder="Mật khẩu Admin"><button onclick="adminLogin()">Đăng nhập</button><p id="ls" class="muted">Mật khẩu đã cấu hình: tranvinhzin</p></div><div id="dash" style="display:none"><div class="box"><h2>Danh sách đơn</h2><button onclick="load()">🔄 Làm mới</button><div id="orders"></div></div><div class="box"><h2>Admin Test</h2><p class="muted">Tạo đơn 0đ để kiểm tra luồng cấp Key/file.</p><select id="prod"><option value="panel_vip">PANEL VIP</option><option value="aim_body_ios">AIM BODY</option><option value="dvi_xanh_adr">DVI XANH - Keo Mờ</option></select><button onclick="test()">Mua FREE (0đ)</button><p id="ts" class="muted"></p></div></div></div><script>let pass=sessionStorage.getItem('tv_admin')||'';if(pass)show();function adminLogin(){pass=pw.value;fetch('/admin/api/orders',{headers:{'x-admin-password':pass}}).then(r=>{if(!r.ok)throw 0;sessionStorage.setItem('tv_admin',pass);show()}).catch(()=>ls.textContent='Mật khẩu không đúng.')}function show(){login.style.display='none';dash.style.display='block';load()}const money=n=>new Intl.NumberFormat('vi-VN').format(n)+'đ';async function load(){const r=await fetch('/admin/api/orders',{headers:{'x-admin-password':pass},cache:'no-store'});if(!r.ok)return;const a=await r.json();orders.innerHTML=a.length?a.map(o=>`<div class="order"><div class="row"><b>${o.orderId}</b><span class="${o.status==='PAID'?'paid':'pending'}">${o.status==='PAID'?'ĐÃ THANH TOÁN':'CHỜ THANH TOÁN'}</span></div><div class="row"><span>${o.product}</span><b>${money(o.amount)}</b></div><div class="muted">Khách: ${o.username} ${o.edition?'• '+o.edition:''}</div>${o.key?`<div class="key">🔑 ${o.key}</div>`:''}${o.status!=='PAID'?`<button onclick="confirmOrder('${o.orderId}')">✓ Xác nhận đã nhận tiền</button>`:''}</div>`).join(''):'<p class="muted">Chưa có đơn.</p>'}async function confirmOrder(id){if(!confirm('Bạn đã kiểm tra giao dịch và nhận đúng số tiền?'))return;const r=await fetch('/admin/api/orders/confirm',{method:'POST',headers:{'x-admin-password':pass,'Content-Type':'application/json'},body:JSON.stringify({orderId:id})});if(!r.ok){alert('Không xác nhận được');return}load()}async function test(){const r=await fetch('/admin/api/test-order',{method:'POST',headers:{'x-admin-password':pass,'Content-Type':'application/json'},body:JSON.stringify({productId:prod.value})});const x=await r.json();ts.textContent=r.ok?`Đơn test ${x.orderId} — ${x.status}${x.key?' — Key: '+x.key:''}`:(x.error||'Lỗi');load()}</script></body></html>
